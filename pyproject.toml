[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "open-eeg-synth"
dynamic = ["version"]
description = "Realistic, seeded synthetic EEG for teaching, demos and software testing."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<3.13"
authors = [{ name = "Peak Mind LLC" }]
keywords = ["eeg", "qeeg", "synthetic-data", "simulation", "education", "neurofeedback"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
# The runtime needs numpy only. Anything heavier is an optional extra.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Writing case files as EDF.
edf = ["edfio>=0.4"]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/peak-mind-llc/open-eeg-synth"
Repository = "https://github.com/peak-mind-llc/open-eeg-synth"
Issues = "https://github.com/peak-mind-llc/open-eeg-synth/issues"
Changelog = "https://github.com/peak-mind-llc/open-eeg-synth/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/open_eeg_synth/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/open_eeg_synth"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tools", "docs", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: downloads public reference recordings or runs long simulations (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
