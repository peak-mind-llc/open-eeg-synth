name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]" build
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Test (slow)
        if: matrix.python == '3.11'
        run: pytest -m slow -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Check wheel data files
        run: unzip -l dist/*.whl | grep -E "colin27_19ch.npz|eog_patterns.npz|NOTICE-colin27.txt|NOTICE-eegmmidb.txt" | wc -l | grep -qx 4
      - name: Use the wheel in a bare environment
        # Only the wheel and its edf extra: no dev extras, and not run from the checkout.
        run: |
          python -m venv "$RUNNER_TEMP/bare"
          "$RUNNER_TEMP/bare/bin/pip" install "$(ls "$PWD"/dist/*.whl)[edf]"
          cd "$RUNNER_TEMP"
          bare/bin/python -m open_eeg_synth make-case --seed 1 --out case
          bare/bin/python -c "import glob; from open_eeg_synth.casefile.writer import read_case_truth, render_layers; t = read_case_truth(glob.glob('case/*.truth')[0]); r = render_layers(t, 'eyes_open'); print(t['case_id'], sorted(r.layers))"
